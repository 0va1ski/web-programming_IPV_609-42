{% extends "base_layout.html" %}
{% load static %}
{% block title %}Create Article{% endblock %}

{% block content %}
    <h1>Create Article</h1>
    <form class="form" action="{% url 'articles:article_create' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form }}
        <button type="submit">Create article</button>
    </form>
{% endblock content %}
